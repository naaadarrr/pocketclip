                <svg viewBox="0 0 32 32" width="22" height="22" fill="none" aria-hidden="true"><path d="M7 24 C9.2 24 9.2 8 11.5 8 C13.8 8 13.8 24 16.1 24 C18.4 24 18.4 8 20.7 8 C23 8 23 20 25 14" stroke="currentColor" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
              </button>
            </div>
            <div class="history-btns">
              <button type="button" id="btn-undo" class="draw-icon-btn" data-tooltip="Undo" data-tip="top" aria-label="Undo">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg>
              </button>
              <button type="button" id="btn-redo" class="draw-icon-btn" data-tooltip="Redo" data-tip="top" aria-label="Redo">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 14l5-5-5-5"/><path d="M20 9H10a6 6 0 0 0 0 12h3"/></svg>
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div id="eyedrop-chip" class="eyedrop-chip" hidden>
    <button type="button" class="eyedrop-chip__main" id="eyedrop-chip-main" aria-label="Copy color">
      <span class="eyedrop-chip__swatch" id="eyedrop-chip-swatch"></span>
      <span class="eyedrop-chip__value" id="eyedrop-chip-value">#000000</span>
    </button>
    <button type="button" class="eyedrop-chip__mode" id="eyedrop-chip-mode" aria-label="HEX">HEX</button>
  </div>
  <p id="toast" class="toast" hidden></p>
  <div class="color-picker-pop" id="color-picker-pop" hidden role="dialog" aria-label="Custom color">
    <div class="cp-sv" id="cp-sv">
      <canvas id="cp-sv-canvas" width="104" height="64"></canvas>
      <div class="cp-sv-knob" id="cp-sv-knob"></div>
    </div>
    <div class="cp-hue" id="cp-hue">
      <canvas id="cp-hue-canvas" width="104" height="8"></canvas>
      <div class="cp-hue-knob" id="cp-hue-knob"></div>
    </div>
    <div class="cp-row">
      <span class="cp-preview" id="cp-preview"></span>
      <input class="cp-hex" id="cp-hex" type="text" spellcheck="false" maxlength="7" value="#262523" />
    </div>
  </div>
  <script src="../sfx.js"></script>
  <script src="perfect-freehand.js"></script>
  <script src="editor.js?v=1.10.99"></script>

</body>
